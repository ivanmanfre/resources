/* Capture-beacon fix, scoped to this page only (same override the RISE client pages carry).
   The shared beacon() in _engine/shared.js sends via navigator.sendBeacon or a header-less
   fetch, both of which reach the Supabase gateway with no auth header and 401. This override
   adds the publishable anon key (apikey + Bearer) on a single authenticated fetch with
   keepalive:true, which is unload-safe on its own, so captures record exactly once. It
   replaces only window.LM.beacon on this page and does not touch shared.js, which ~79 other
   LM pages share. */
(function () {
  if (!window.LM || typeof window.LM.canonicalBeaconEvent !== "function") return;
  var BEACON = window.__lm_beacon_url || "https://bjbvqvzbzczjbatgmccb.supabase.co/functions/v1/lm-beacon";
  var KEY = window.__supabase_anon_key || "sb_publishable_Q-kfisfhqxXV5xiIhCduMQ_QSIflf4h";
  window.LM.beacon = function (tool_type, event, extra) {
    try {
      var body = window.LM.canonicalBeaconEvent(tool_type, event, extra);
      fetch(BEACON, {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": KEY, "Authorization": "Bearer " + KEY },
        body: JSON.stringify(body),
        keepalive: true
      }).catch(function () {});
    } catch (_) {}
  };
})();
</script>
